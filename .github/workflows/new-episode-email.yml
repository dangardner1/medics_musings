name: New episode email

# Checks the podcast RSS feed every 15 minutes. (GitHub delays scheduled runs when
# it is busy, and a 2-hour schedule was really firing every 4 to 9 hours, which left
# new episodes waiting most of a day. Frequent, cheap runs shorten the wait; a run
# that finds nothing new takes about 15 seconds and changes nothing.)
# When a new episode appears in the feed it:
#   1. adds the episode to the site (data/episodes.json, its page, the sitemap)
#      and publishes that, then
#   2. emails the Mailchimp audience, linking to the new page once it is live.
# Needs the MAILCHIMP_API_KEY secret (Mailchimp > Profile > Extras > API keys),
# stored in the "MAILCHIMP_API_KEY" environment. Without it, runs only add the
# episode to the site and record the feed; nothing is emailed.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = print only, draft = create in Mailchimp without sending, test = email one address, send = email the audience, setup-topics = create the TOPICS field for topic choices (run once)'
        type: choice
        default: dry-run
        options: [dry-run, draft, test, send, auth-check, setup-topics]
      force_latest:
        description: 'Use the newest episode even if it was already handled (for previews and tests)'
        type: boolean
        default: false
      test_email:
        description: 'Address for mode=test (blank = the audience''s from address)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: new-episode-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    environment: MAILCHIMP_API_KEY
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only real ("send") runs change the site; manual test runs just report.
      - name: Add new episodes to the site
        id: sync
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.mode || 'send' }}" = "send" ]; then
            node scripts/sync-episodes.mjs --write
          else
            node scripts/sync-episodes.mjs
          fi

      # continue-on-error keeps the email step running, but it also hides a failure,
      # so say so in the run summary.
      - name: Flag a failed sync
        if: ${{ steps.sync.outcome == 'failure' }}
        run: echo "::warning::Adding new episodes to the site failed, so the site was not updated. See the step above."

      - uses: actions/setup-python@v5
        if: ${{ (github.event.inputs.mode || 'send') == 'send' }}
        with:
          python-version: '3.12'

      - name: Make share images for new episodes
        if: ${{ (github.event.inputs.mode || 'send') == 'send' }}
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python scripts/make-share-images.py --missing
          node scripts/build-episodes.mjs

      - name: Publish the site update
        if: ${{ (github.event.inputs.mode || 'send') == 'send' }}
        run: |
          # Everything the build wrote: the episode page and short link (/e/N/), its embed,
          # the RSS feeds, topic and series pages, share image, sitemap and service worker.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add new episode(s) from the podcast feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check the feed and email new episodes
        run: node scripts/new-episode-email.mjs
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'send' }}
          FORCE_LATEST: ${{ github.event.inputs.force_latest || 'false' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}

      - name: Keep a copy of the email that was built
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: newsletter-preview.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Save what has been emailed
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain .github/newsletter-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/newsletter-state.json
            git commit -m "Update newsletter state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
