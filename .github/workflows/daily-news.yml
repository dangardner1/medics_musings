name: News of the Day

# Health Care News of the Day: one real story with a satirical headline and take.
#
# Every morning (scripts/fetch-daily-news.mjs): with an ANTHROPIC_API_KEY
# secret, Claude picks a story and writes the satirical headline and take, a
# second pass checks them (never mocking patients, no invented facts), and the
# day is published automatically. Anything that fails a check is held as
# "review" and an issue is opened. Without the secret, the issue lists
# candidates for a person (or Claude in a session) to write up.
#
# Manual publishing: changing a day's "status" to "published" and pushing to
# main triggers the publish job, which rebuilds the site.
on:
  schedule:
    - cron: '7 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/news/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gather candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-daily-news.mjs

      # Builds only published days, so a held draft changes nothing on the site.
      - name: Rebuild the site
        run: node scripts/build-episodes.mjs

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "News of the Day for $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new draft."
          fi

      # Only when today's item was held for review (news-issue.mjs prints nothing
      # once it's published).
      - name: Open a review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/news-issue.mjs > body.md
          if [ -s body.md ]; then
            gh issue create --title "News of the Day draft ready ($(date -u +%Y-%m-%d))" --body-file body.md
          fi

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the site
        run: node scripts/build-episodes.mjs

      - name: Publish
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish News of the Day"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing to publish."
          fi
