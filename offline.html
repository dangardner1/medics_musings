<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline — Medics Musings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f14">
<style>
  :root { --bg: #0b0f14; --text: #f4f1ea; --muted: #8892a0; --accent: #ff5a3c; --pulse: #35d399; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f5f0; --text: #14181d; --muted: #5b6472; --accent: #d8431e; --pulse: #17825c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.55;
  }
  main { max-width: 460px; }
  .eyebrow { font-family: ui-monospace, monospace; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pulse); }
  h1 { margin: 10px 0 14px; font-family: "Arial Narrow", sans-serif; font-size: 2.6rem; line-height: 1; text-transform: uppercase; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="eyebrow">No signal</span>
  <h1>You&#x27;re offline.</h1>
  <p>This page isn&#x27;t saved on your device yet. Pages you&#x27;ve already visited still open without a connection, and episodes play again once you&#x27;re back online.</p>
  <p><a href="/">Try the homepage</a></p>
</main>
</body>
</html>
